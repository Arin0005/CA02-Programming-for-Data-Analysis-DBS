name: Test Dublin V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get V2 code
        uses: actions/checkout@v4
        with:
          ref: new-main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Collect Dublin train data
        run: python scripts/collect_boards.py

      - name: Show collected files
        run: |
          echo "Generated files:"
          find data -type f | head -30

      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
          name: dublin-v2-test-data
          path: data/
