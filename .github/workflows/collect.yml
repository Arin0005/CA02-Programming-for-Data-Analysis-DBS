# Runs hourly from 05:07 to 23:07 Irish local time on GitHub's servers (your laptop can be off), collects the
# three data sources and commits the CSV files back into this repo.

name: Collect data

on:
  schedule:
    # Every hour from 05:07 to 23:07 .
    # GitHub handles winter/summer time using Europe/Dublin.
    - cron: "7 5-23 * * *"
      timezone: "Europe/Dublin"
  workflow_dispatch: # adds a "Run workflow" button so you can test by hand

# Needed so the workflow is allowed to commit to your repo
permissions:
  contents: write

# Never run two collections (or a collection and the end-of-day job) at the
# same time - they would clash when saving to the repo.
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # One time stamp for the whole run, shared by all three scripts
      - name: Set run time
        run: echo "RUN_UTC=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"

      # "if: always()" = each source is still tried even if an earlier one
      # failed. The run is marked failed (red) if any of them failed.
      - name: Collect Irish Rail trains
        if: always()
        run: python scripts/collect_trains.py

      - name: Collect Open-Meteo weather
        if: always()
        run: python scripts/collect_openmeteo.py

      - name: Collect Met Eireann observations
        if: always()
        run: python scripts/collect_met_eireann.py

      # Save whatever was collected (also saves the failure log)
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Data $RUN_UTC"
            git pull --rebase
            git push
          fi
