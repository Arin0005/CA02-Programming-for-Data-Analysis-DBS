name: Collect data

on:
  schedule:
    # Off-peak minute (:23) avoids GitHub's top-of-hour queue delays and dropped runs.
    # Runs 05:23 to 23:23 UTC (matches Europe/Dublin GMT until March 28, 2027).
    - cron: "23 5-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Set run time
        run: echo "RUN_UTC=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"

      - name: Collect Irish Rail trains
        if: always()
        run: python scripts/collect_trains.py

      - name: Collect Open-Meteo weather
        if: always()
        run: python scripts/collect_openmeteo.py

      - name: Collect Met Eireann observations
        if: always()
        run: python scripts/collect_met_eireann.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Data $RUN_UTC"
            git pull --rebase -X ours || true
            git push
          fi
