# Once a day, takes YESTERDAY's raw data and:
#   1. removes duplicate trains  -> data/clean/
#   2. merges trains + weather   -> data/merged/
#   3. writes a check report     -> data/reports/
# then commits the results. Raw files are never touched.

name: End of day processing

on:
  schedule:
    # 00:30 UTC every day. Running just AFTER midnight means the previous
    # day is complete (the 23:07 hourly run has long finished).
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day to process, like 2026-11-15 (leave empty for yesterday)"
        required: false

permissions:
  contents: write

# Same group name as collect.yml so the two never run at the same time
concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Work out which day to process
        env:
          INPUT_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$INPUT_DAY" ]; then
            echo "DAY=$INPUT_DAY" >> "$GITHUB_ENV"
          else
            echo "DAY=$(date -u -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_ENV"
          fi

      - name: Remove duplicate trains
        run: python scripts/clean_trains.py "$DAY"

      - name: Merge trains with weather
        run: python scripts/merge_data.py "$DAY"

      - name: Write the check report
        run: python scripts/inspect_data.py "$DAY" --save

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "End of day processing for $DAY"
            git pull --rebase
            git push
          fi
